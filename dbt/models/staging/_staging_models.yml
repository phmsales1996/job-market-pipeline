models:
  - name: stg_lever_postings
    description: >
      One row per Lever job posting, current state - the same grain as
      raw.lever_postings. Renames Lever's columns to the canonical names in
      CANONICAL_MODEL.md and adds `source`, so the six staging models can be stacked
      into one table later. Translates, never filters: every raw row comes through.
    columns:
      - name: source
        description: >
          Which ATS the row came from - always 'lever' here. Half of the canonical key:
          ids are only unique within a source (Greenhouse and Recruitee ids are both
          integers and can collide), so the stacked table is keyed on
          (source, source_job_id).
      - name: source_job_id
        description: >
          Lever's own posting id (raw `id`), a UUID string. Unique within Lever - tested
          here - but only unique across sources together with `source`.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Job title as published by the company. Not cleaned.
      - name: job_url
        description: >
          Public URL of the posting on the company's Lever board (raw `url`). The page a
          job seeker reads; the apply link is this URL plus '/apply' and is not kept.
      - name: country_code
        description: >
          Country as an ISO-3166 alpha-2 code (raw `country`), e.g. 'US', 'PL'. Lever
          already sends ISO codes, so it is only renamed - no mapping needed, unlike
          Ashby ('USA') or Teamtailor ('Norway'). NULL when the posting gives no country
          (~0.7% of rows).
      - name: first_seen_at
        description: >
          Pipeline timestamp: when this job first appeared in a landed file. Not when the
          company published it - the day a source or board is added, every existing job
          is "first seen".
      - name: last_seen_at
        description: >
          Pipeline timestamp: when this job was most recently seen in a landed file. The
          only freshness signal for Lever (it publishes no updated_at), and the column
          the source freshness check uses.
      - name: workplace_type
        description: >
          Canonical remoteness: one of 'remote', 'hybrid', 'in_person', 'unknown'.
          Translated from Lever's word through the workplace_type_map seed (keyed on
          source + raw value), so every source's interpretation lives in one reviewable
          file. NULL would mean Lever sent a word the seed does not know yet - which the
          not_null test turns into a failure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['remote', 'hybrid', 'in_person', 'unknown']
      - name: workplace_type_raw
        description: >
          Lever's own word for remoteness (raw `workplace_type`), kept untouched next to
          the translation so it stays visible and reversible. Observed values: 'remote',
          'onsite', 'hybrid', 'unspecified'.
      - name: location_raw
        description: >
          Location as the company wrote it (raw `location`), e.g. 'Remote', 'London'.
          Free text, not normalised - kept for display and for debugging the derived
          location fields. Lever can list several locations; only this first one is a
          column (the rest are in the raw payload).
      - name: team
        description: >
          The team the posting belongs to, e.g. 'Sales'. Comes from the raw column named
          `department`, which actually holds Lever's `categories.team` - renamed here to
          what it is. Lever's real department level is not stored. Which of department /
          team becomes the canonical "department" is decided when the sources are stacked
          (Ashby has both).
      - name: published_at
        description: >
          When the company published the posting (Lever's `createdAt`, converted from
          epoch milliseconds by the loader). A source timestamp - measures the job market,
          not the pipeline; compare first_seen_at.
      - name: salary_min
        description: >
          Lower bound of the advertised pay, as published, in salary_currency, per the
          interval Lever states (not yet a column - translated through a seed in a later
          step). NOT annualised: 24.5 can be an hourly wage. Contains bad values (0,
          100,000,000 per year, yearly figures labelled bi-weekly); cleaning and
          annualising are later, explicit steps. NULL for ~84% of postings.
      - name: salary_max
        description: Upper bound of the advertised pay. Same caveats as salary_min.
      - name: salary_currency
        description: Currency of the advertised pay, an ISO-4217 code (e.g. 'USD').
      - name: salary_interval
        description: >
          Canonical pay period of salary_min/max: 'year', 'month', 'semi_month' (24 a
          year), 'bi_week' (26 a year), 'week', 'day', 'hour' - kept distinct because
          they annualise differently. Translated through the salary_interval_map seed.
          NULL when the posting advertises no salary. A Lever word missing from the seed
          also gives NULL - caught by tests/assert_lever_salary_interval_mapped.sql.
          Translates the label faithfully: Lever's 3 'bi-week' postings of 75k-195k are
          almost certainly mislabelled yearly figures, and stay 'bi_week' here.
        data_tests:
          - accepted_values:
              arguments:
                values: ['year', 'month', 'semi_month', 'bi_week', 'week', 'day', 'hour', 'one_time']
      - name: salary_interval_raw
        description: >
          Lever's own pay-period word (raw `salary_interval`), kept next to the
          translation: 'per-year-salary', 'per-month-salary', 'semi-month-salary',
          'bi-week-salary', 'per-day-wage', 'per-hour-wage'.
      - name: lists_text
        description: >
          Lever's `lists` sections as plain text: each section's title, ': ', then its
          content cleaned by the html_to_text macro; sections in posting order, separated
          by a blank line. Usually the requirements / qualifications. Lever sends these as
          HTML only (no plain twin), so this is the one piece converted in SQL. NULL when
          the posting has no lists (~11%). Measured 2026-10-04: no leftover tags; 3 of
          14,601 postings keep an entity (double-escaped by the company, or the rare
          &apos;).
      - name: description_text
        description: >
          The full job text as plain text, in posting order: opening, description, the
          lists sections (lists_text), additional - joined by blank lines, empty pieces
          skipped. Every piece is converted from Lever's HTML with the html_to_text macro:
          Lever's plain-text twins (descriptionPlain etc.) are blank for ~half the postings
          even when the HTML has a full description, so they are not used. NULL only when
          every piece is empty (40 postings). Measured 2026-10-04: no leftover tags (tested
          by assert_lever_description_text_clean); 6 postings keep an entity (double-escaped
          in the source, decoded once by design).

  - name: stg_ashby_postings
    description: >
      One row per Ashby job posting, current state - the same grain as raw.ashby_postings.
      Renames Ashby's columns to the canonical names and translates its vocabulary through
      the seeds (workplace, salary interval, country). Translates, never filters. Unlike
      Lever, Ashby has both a department and a team, and its description is already plain
      text.
    columns:
      - name: source
        description: Always 'ashby'. Half of the canonical key (source, source_job_id).
      - name: source_job_id
        description: Ashby's own posting id (raw `id`), a UUID string. Unique within Ashby.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Job title as published. Not cleaned.
      - name: job_url
        description: Public URL of the posting on the company's Ashby board (raw `url`).
      - name: country_code
        description: >
          ISO-3166 alpha-2, translated from Ashby's country NAME through the country_codes
          seed ('United States' and 'USA' both -> 'US'). NULL when Ashby gives no country, or
          names a region the seed knows has no country ('European Union', 'Latin America').
      - name: country_raw
        description: >
          Ashby's country as sent (a name, e.g. 'United States', 'USA', 'Brazil'); an empty
          string is turned into NULL. Every value must be known to the country_codes seed -
          tested by assert_ashby_country_known.
      - name: first_seen_at
        description: Pipeline timestamp - when this job first appeared in a landed file.
      - name: last_seen_at
        description: Pipeline timestamp - when this job was last seen; the only freshness signal (Ashby has no updated_at).
      - name: workplace_type
        description: >
          Canonical remoteness: 'remote', 'hybrid', 'in_person', 'unknown'. From Ashby's word via
          the workplace_type_map seed; 'unknown' when Ashby says nothing (~10%). NULL only for a
          word the seed doesn't know - which not_null turns into a failure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['remote', 'hybrid', 'in_person', 'unknown']
      - name: workplace_type_raw
        description: Ashby's own word ('Remote', 'Hybrid', 'OnSite'), or NULL when it gives none.
      - name: location_raw
        description: Location as written by the company (raw `location`). Free text.
      - name: department
        description: Department as published, e.g. 'Engineering' - the level above team.
      - name: team
        description: Team as published, e.g. 'Design Engineering & Mobile' - the level below department.
      - name: published_at
        description: When the company published the posting (a source timestamp).
      - name: salary_min
        description: >
          Lower bound of the advertised pay, from the single 'Salary' compensation component.
          CAUTION: Ashby's 'Salary' can be on-target earnings (base + bonus), not base pay -
          see compensation_summary. Not annualised.
      - name: salary_max
        description: Upper bound of the advertised pay. Same caveats as salary_min.
      - name: salary_currency
        description: Currency of the advertised pay, ISO-4217.
      - name: salary_interval
        description: >
          Canonical pay period ('year', 'month', 'week', 'hour', 'one_time', ...) via the
          salary_interval_map seed. 'one_time' = a one-off payment, never annualised.
        data_tests:
          - accepted_values:
              arguments:
                values: ['year', 'month', 'semi_month', 'bi_week', 'week', 'day', 'hour', 'one_time']
      - name: salary_interval_raw
        description: Ashby's own interval ('1 YEAR', '1 HOUR', '1 MONTH', '1 WEEK', '1 TIME').
      - name: compensation_summary
        description: >
          Ashby's human-readable pay summary - the only place base vs bonus vs equity is
          visible (e.g. '$86.5K - Base: $51.5K; Variable Bonus: $35K').
      - name: description_text
        description: >
          The job description as plain text (Ashby's descriptionPlain, stored by the loader).
          No HTML conversion needed. Empty strings become NULL.

  - name: stg_recruitee_postings
    description: >
      One row per Recruitee job posting, current state - the same grain as
      raw.recruitee_postings. Renames Recruitee's columns to the canonical names. Two columns
      are interpreted rather than renamed: workplace_type (collapsed from three booleans) and
      country_code (already ISO, confirmed against the country_codes seed). Translates, never
      filters. Recruitee splits its text into three HTML sections; they are converted and
      assembled into description_text. Not here yet: the mapped employment type.
    columns:
      - name: source
        description: Always 'recruitee'. Half of the canonical key (source, source_job_id).
      - name: source_job_id
        description: >
          Recruitee's own posting id (raw `id`), an integer cast to STRING so the key has one
          type across sources. Unique within Recruitee.
        data_tests:
          - not_null
          - unique
      - name: title
        description: >
          Job title as published, in the one translation the loader kept (raw `language`).
          Not cleaned.
        data_tests:
          - not_null
      - name: language
        description: >
          Language code of the title (and, later, of the description), e.g. 'en', 'pt', 'de'.
          Chosen by the loader, not sent by Recruitee: a posting can carry several
          translations and one is kept - English if present, else Portuguese, else the first
          code alphabetically, so the choice cannot flip between runs. NULL when the posting
          has no translations at all.
      - name: job_url
        description: >
          Public URL of the posting (raw `url`, Recruitee's `careers_url`). Often on the
          company's own domain rather than recruitee.com.
        data_tests:
          - not_null
      - name: country_code
        description: >
          ISO-3166 alpha-2. Recruitee already sends a code, so nothing is translated: the join
          to the country_codes seed (which lists every code as its own identity row) only
          confirms the code is a real one. NULL would mean no country, or a code the seed does
          not know. On 2026-10-05 all 23,005 postings had a known code - an observation, not
          a promise from Recruitee, so not_null only warns: a posting without a country is
          legitimate data, but the first one is worth hearing about.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: country_raw
        description: >
          Recruitee's `country_code` as sent (trimmed; an empty string would become NULL).
          Kept next to country_code so a code the seed rejects stays visible. Every value
          must be known to the country_codes seed - tested by assert_recruitee_country_known.
      - name: first_seen_at
        description: Pipeline timestamp - when this job first appeared in a landed file.
      - name: last_seen_at
        description: >
          Pipeline timestamp - when this job was last seen in a landed file. The column the
          source freshness check uses.
      - name: workplace_type
        description: >
          Canonical remoteness: 'remote', 'hybrid', 'in_person', 'unknown'. An interpretation,
          not a lookup: Recruitee sends three independent booleans (remote, hybrid, on_site)
          and 9.4% of postings set more than one. Rule: the most flexible option offered wins
          (remote, then hybrid, then in_person). So 'remote' here means "remote is offered",
          possibly among other options - unlike Lever and Ashby, where the source picks one
          value. Evidence (2026-10-05): a sample of the 91 postings flagged remote + on_site
          read mostly as remote roles. 'unknown' when no flag is true. Never NULL by
          construction; not_null guards against a later edit of the rule.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['remote', 'hybrid', 'in_person', 'unknown']
      - name: workplace_type_raw
        description: >
          The flags Recruitee set to true, in its own words, joined by '-': 'remote',
          'hybrid', 'on_site', 'hybrid-on_site', 'remote-hybrid-on_site', ... NULL when none
          is true. Keeps multi-flag postings distinguishable after workplace_type collapses
          them.
      - name: location_raw
        description: >
          Location display string as published (raw `location`), e.g. 'Remote job' or a city.
          Free text, not normalised.
      - name: department
        description: Department as published. Often NULL - many boards do not use it.
      - name: employment_type_raw
        description: >
          Recruitee's own employment type code (raw `employment_type`), e.g. 'fulltime',
          'freelance'. Not mapped: there is no canonical employment_type until its seed exists.
      - name: published_at
        description: When the company published the posting (a source timestamp).
      - name: updated_at
        description: >
          When Recruitee last changed the posting (a source timestamp). Only Recruitee and
          Greenhouse say this; for the other sources last_seen_at is the only signal. Not the
          same thing as last_seen_at: this is the source editing the posting, that is our
          pipeline seeing it.
      - name: salary_min
        description: >
          Lower bound of the advertised pay (Recruitee's `salary.min`). Usually NULL: every
          posting carries a salary object, but few fill it in. Not annualised - see
          salary_period_raw.
      - name: salary_max
        description: Upper bound of the advertised pay. Same caveats as salary_min.
      - name: salary_currency
        description: Currency of the advertised pay, as Recruitee sends it.
      - name: salary_period_raw
        description: >
          Recruitee's own word for the pay period (raw `salary_period`), kept untouched next
          to the translation. Observed 2026-10-05: 'month', 'year', 'hour', or NULL when the
          posting gives no salary period.
      - name: salary_interval
        description: >
          Canonical pay period ('year', 'month', 'hour', ...), translated through the
          salary_interval_map seed (keyed on source + raw value). Recruitee's words happen to
          equal the canonical ones, but they still go through the seed: a word it has never
          seen comes out NULL here instead of leaking into the canonical column. NULL
          otherwise means the posting gave no period.
        data_tests:
          - accepted_values:
              arguments:
                values: ['year', 'month', 'semi_month', 'bi_week', 'week', 'day', 'hour', 'one_time']
      - name: description_text
        description: >
          The full job text as plain text, in the order of the job page: highlight (a short
          opening sentence, 27% of postings), content (100%), requirements (80%) - joined by
          blank lines, missing sections skipped. Each section is converted from HTML by the
          html_to_text macro. In the one language the loader kept (see language). NULL for
          the few postings whose sections hold no text once the markup is removed (4 on
          2026-10-05). 0.6% carry stray literal markup the company pasted in - counted, as
          a warning, by assert_recruitee_description_text_clean.

  - name: stg_teamtailor_postings
    description: >
      One row per Teamtailor job posting, current state - the same grain as
      raw.teamtailor_postings. Renames Teamtailor's columns to the canonical names and
      translates its vocabulary through the seeds (workplace, country). Translates, never
      filters. Teamtailor publishes no salary, no employment type and no updated_at, so
      those columns do not exist here.
    columns:
      - name: source
        description: Always 'teamtailor'. Half of the canonical key (source, source_job_id).
      - name: source_job_id
        description: >
          Teamtailor's own posting id (raw `id`, the feed's `guid`), a UUID string. Unique
          within Teamtailor.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Job title as published. Not cleaned.
        data_tests:
          - not_null
      - name: job_url
        description: Public URL of the posting on the company's Teamtailor career site (raw `url`).
        data_tests:
          - not_null
      - name: first_seen_at
        description: Pipeline timestamp - when this job first appeared in a landed file.
      - name: last_seen_at
        description: >
          Pipeline timestamp - when this job was last seen in a landed file. The only
          freshness signal for Teamtailor (it publishes no updated_at), and the column the
          source freshness check uses.
      - name: workplace_type_raw
        description: >
          Teamtailor's own word for remoteness (raw `remote_status`), kept untouched next to
          the translation. Observed 2026-10-05: 'none' (61%), 'hybrid', 'fully', 'onsite',
          'temporary'. Never NULL so far.
      - name: workplace_type
        description: >
          Canonical remoteness: 'remote', 'hybrid', 'in_person', 'unknown'. Translated through
          the workplace_type_map seed (keyed on source + raw value). Two rows are
          interpretations: 'none' -> 'in_person' (read as "no remote work": a sample of
          postings looked not remote, 0.3% of their titles mention remote or hybrid, and the
          61% share matches Recruitee's on-site share - but 'none' is probably also the
          field's default, so some are simply never set), and 'temporary' -> 'hybrid'
          (temporarily remote: some remote work, not a lasting remote job; 44 postings).
          NULL would mean a word the seed does not know.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['remote', 'hybrid', 'in_person', 'unknown']

      - name: country_code
        description: >
          ISO-3166 alpha-2, translated from Teamtailor's country NAME through the
          country_codes seed. NULL when the posting has no country (712 on 2026-10-05), or
          names a region the seed knows has no country.
      - name: country_raw
        description: >
          Teamtailor's country as sent, a name (e.g. 'Norway', 'Brazil'). The country of the
          one location the loader kept: a Brazilian one if the posting has any, else the
          first listed.
      - name: location_raw
        description: >
          Name of the location the loader kept (raw `location`), as the company wrote it.
          Free text, not normalised. Postings can list several locations; the others stay in
          the raw payload.
      - name: role
        description: >
          Teamtailor's role for the posting, the level below department. Filled for about
          45% of postings.
      - name: department
        description: Department as published. Filled for about 78% of postings.
      - name: published_at
        description: >
          When the company published the posting (a source timestamp; converted from RFC-822
          by the loader).
      - name: description_text
        description: >
          The job description as plain text, converted from Teamtailor's single HTML field by
          the html_to_text macro. The full posting, not a summary. NULL for the few postings
          with no text once the markup is removed (7 on 2026-10-05).

  - name: stg_workable_postings
    description: >
      One row per Workable job posting, current state - the same grain as
      raw.workable_postings. Renames Workable's columns to the canonical names and translates
      its vocabulary through the seeds (workplace, salary interval, country). Translates,
      never filters. Workable has two endpoints. The LIST gives the basics for every posting
      and, since 2026-10-06, the full description (asked with ?details=true). The DETAIL has
      what the list lacks - salary, language and the workplace word - but its rate limit
      (about 300 requests, then blocked for hours) cannot keep up with ~660 new postings a
      night, so it is not called at the moment. Those columns are filled only for the 650
      postings fetched before the switch and are NULL for the rest.
    columns:
      - name: source
        description: Always 'workable'. Half of the canonical key (source, source_job_id).
      - name: source_job_id
        description: >
          Workable's job shortcode (raw `id`), e.g. 'F8C64DEEC8'. Unique within Workable.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Job title as published. Not cleaned.
        data_tests:
          - not_null
      - name: job_url
        description: Public URL of the posting (raw `url`).
        data_tests:
          - not_null
      - name: first_seen_at
        description: Pipeline timestamp - when this job first appeared in a landed file.
      - name: last_seen_at
        description: >
          Pipeline timestamp - when this job was last seen in a landed file. The only
          freshness signal for Workable (it publishes no updated_at), and the column the
          source freshness check uses.
      - name: workplace_type_raw
        description: >
          Workable's own word for remoteness from the DETAIL (raw `workplace`): 'on_site',
          'hybrid', 'remote'. NULL unless the posting's detail was fetched (not requested
          since 2026-10-06).
      - name: workplace_type
        description: >
          Canonical remoteness: 'remote', 'hybrid', 'in_person', 'unknown'. Built in order of
          trust: (1) the detail's word, translated through the workplace_type_map seed;
          (2) with no detail, telecommuting = true -> 'remote'; (3) otherwise 'unknown'.
          Evidence (2026-10-05, the 650 postings with both fields): telecommuting = true was
          'remote' 152 times out of 152, but telecommuting = false was 'on_site' 349 times and
          'hybrid' 149 - so false alone cannot tell the two apart, and 'in_person' would be
          wrong for about 3 in 10. With details switched off, these postings stay 'unknown':
          remote is still found, hybrid and on-site are not told apart. NULL only for a detail
          word the seed does not know.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['remote', 'hybrid', 'in_person', 'unknown']
      - name: telecommuting
        description: >
          Workable's remote flag from the LIST (present for every posting). Kept beside
          workplace_type_raw because it is the second input of workplace_type.
      - name: country_raw
        description: >
          Workable's ISO-3166 alpha-2 code as sent (raw `country_code`, the first listed
          location). Workable also sends the country as a name; the code is used because it
          needs no translation and is filled for all but one posting.
      - name: country_code
        description: >
          ISO-3166 alpha-2. Already a code at the source: the join to the country_codes seed
          (which lists every code as its own identity row) only confirms it is a real one.
          NULL when the posting has no country, or sends a code the seed does not know.
      - name: department
        description: Department as published. Filled for about 78% of postings.
      - name: employment_type_raw
        description: >
          Workable's own employment type ('Full-time', 'Contract', 'Part-time', 'Other',
          'Temporary'). Not mapped: there is no canonical employment_type until its seed
          exists.
      - name: experience
        description: >
          Seniority as published, e.g. 'Director', 'Mid-Senior level'. Workable's own
          taxonomy and the only seniority field among the sources. Filled for about 56%.
      - name: education
        description: Required education as published, e.g. "Bachelor's Degree". Workable's own taxonomy.
      - name: industry
        description: Industry as published. Workable's own taxonomy.
      - name: job_function
        description: Job function as published (Workable's `function`). Workable's own taxonomy.
      - name: language
        description: Posting language from the DETAIL, e.g. 'en'. NULL unless the detail was fetched (not requested since 2026-10-06).
      - name: published_at
        description: >
          When the company published the posting. Workable gives a DATE only (raw
          `published_on`), converted to a timestamp at midnight UTC so every source has the
          same type: the precision is one day, not one second.
      - name: salary_min
        description: >
          Lower bound of the advertised pay, from the DETAIL. NULL without a detail (not
          requested since 2026-10-06), and for most postings with one (about 1 in 5 details
          carries a salary). Not annualised - see salary_interval.
      - name: salary_max
        description: Upper bound of the advertised pay. Same caveats as salary_min.
      - name: salary_currency
        description: Currency of the advertised pay, ISO-4217.
      - name: salary_interval_raw
        description: >
          Workable's own word for the pay period (raw `salary_frequency`), kept untouched next
          to the translation. Observed 2026-10-05: only 'year'.
      - name: salary_interval
        description: >
          Canonical pay period, translated through the salary_interval_map seed (keyed on
          source + raw value). Only 'year' is in the seed for Workable, because it is the only
          word seen so far: a new word comes out NULL here and fails
          assert_workable_salary_interval_mapped, which is the signal to add it.
        data_tests:
          - accepted_values:
              arguments:
                values: ['year', 'month', 'semi_month', 'bi_week', 'week', 'day', 'hour', 'one_time']
      - name: description_text
        description: >
          The full job text as plain text, converted by the html_to_text macro from raw
          `content`: the description the LIST returns, which already contains the
          requirements and benefits sections (checked on one job: 2,104 characters against
          2,036 for the detail's three sections added together). The raw `requirements` and
          `benefits` columns are deliberately not used - for the 650 postings fetched the old
